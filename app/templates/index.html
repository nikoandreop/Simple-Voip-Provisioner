<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple VoIP Provisioner</title>
    <style>
      body { font-family: Arial, sans-serif; margin: 2rem; background: #f7f8fb; }
      .card { background: white; padding: 1.25rem; border-radius: 10px; max-width: 920px; box-shadow: 0 2px 10px rgba(0,0,0,.08); }
      .grid { display: grid; grid-template-columns: repeat(2, minmax(200px, 1fr)); gap: .75rem; }
      input, select, button, textarea { width: 100%; padding: .55rem; border-radius: 6px; border: 1px solid #d5d7df; }
      button { background: #2063f7; color: white; font-weight: 600; cursor: pointer; margin-top: .75rem; }
      pre { background: #0f172a; color: #e2e8f0; padding: .75rem; border-radius: 8px; overflow-x: auto; }
      .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Simple VoIP Provisioner</h1>
      <p>Generate phone configs for Polycom, Yealink, Grandstream, and Cisco by MAC address.</p>
      <form id="provision-form" class="grid">
        <input name="mac" placeholder="MAC (e.g. aa:bb:cc:dd:ee:ff)" required />
        <select name="vendor">
          <option value="polycom">Polycom</option>
          <option value="yealink">Yealink</option>
          <option value="grandstream">Grandstream</option>
          <option value="cisco">Cisco</option>
        </select>
        <input name="model" placeholder="Model (e.g. VVX450)" required />
        <select name="transport">
          <option value="https">HTTPS</option>
          <option value="tftp">TFTP</option>
          <option value="ftp">FTP</option>
        </select>
        <input name="sip_server" placeholder="SIP Server" required />
        <input name="extension" placeholder="Extension" required />
        <input name="sip_user" placeholder="SIP User" required />
        <input name="sip_password" placeholder="SIP Password" required />
      </form>
      <button id="submit">Generate Provisioning Profile</button>

      <h3>Result</h3>
      <pre id="result" class="mono">No provisioning profile generated yet.</pre>
    </div>

    <script>
      const form = document.getElementById('provision-form');
      const result = document.getElementById('result');
      const btn = document.getElementById('submit');

      btn.addEventListener('click', async () => {
        const data = Object.fromEntries(new FormData(form).entries());

        const response = await fetch('/api/provision', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
        });

        const json = await response.json();
        if (!response.ok) {
          result.textContent = `Error: ${json.detail || JSON.stringify(json)}`;
          return;
        }

        result.textContent = JSON.stringify(json, null, 2);
      });
    </script>
  </body>
</html>
